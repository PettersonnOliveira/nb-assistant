spring.application.name=nb-assistant-ai-test

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:tc:postgresql:16:///nb_assistant?TC_IMAGE=pgvector/pgvector:pg16
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

storage.provider=local

spring.ai.google.genai.api-key=test-key
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.project-id=nb-assistant-ai-test
spring.ai.google.genai.location=us-central1

spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.embedding.project-id=${spring.ai.google.genai.project-id}
spring.ai.google.genai.embedding.location=${spring.ai.google.genai.location}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.options.dimensions=768

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
