<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NB Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; background: #0f1115; color: #e6e6e6; }
        h1 { color: #4f9cff; }
        .panel { background: #1a1d24; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        #chatBox { height: 400px; overflow-y: auto; padding: 10px; background: #0f1115; border-radius: 8px; margin-bottom: 12px; }
        .msg-user { text-align: right; margin: 8px 0; }
        .msg-user span { background: #4f9cff; color: #fff; padding: 8px 14px; border-radius: 14px; display: inline-block; }
        .msg-bot { text-align: left; margin: 8px 0; }
        .msg-bot span { background: #262a33; padding: 8px 14px; border-radius: 14px; display: inline-block; max-width: 90%; }
        .sources { font-size: 12px; color: #888; margin-top: 4px; }
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0f1115; color: #eee; }
        input[type=text] { width: 70%; }
        button { background: #4f9cff; color: #fff; border: none; cursor: pointer; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<h1>🤖 NB Assistant</h1>
<p>Conhecimento corporativo, respostas confiáveis.</p>

<div class="panel">
    <h3>📊 Dashboard</h3>
    <div id="dashboardBox">Carregando...</div>
</div>

<div class="panel">
    <h3>📄 Upload de Documento</h3>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file" required />
        <select id="categoryInput" name="category">
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
        </select>
        <button type="submit">Enviar</button>
    </form>
    <p id="uploadStatus"></p>
</div>

<div class="panel">
    <h3>💬 Chat</h3>
    <div id="chatBox"></div>
    <form id="chatForm">
        <input type="text" id="questionInput" placeholder="Como posso ajudar?" required />
        <button type="submit">Enviar</button>
    </form>
</div>

<script th:inline="javascript">
    const chatBox = document.getElementById('chatBox');
    window.chatId = crypto.randomUUID();

    async function loadDashboard() {
        const res = await fetch('/api/dashboard');
        const d = await res.json();

        const categories = Object.entries(d.documentsByCategory)
            .map(([cat, count]) => `${cat}: ${count}`)
            .join(' · ');

        document.getElementById('dashboardBox').innerHTML = `
            <p>📄 Documentos: ${d.totalDocuments} (✅ ${d.processedDocuments} processados,
            ⏳ ${d.pendingDocuments} pendentes, ❌ ${d.failedDocuments} falharam)</p>
            <p>🧩 Chunks indexados: ${d.totalChunks}</p>
            <p>🔢 Embeddings armazenados: ${d.totalEmbeddings}</p>
            <p>💬 Perguntas realizadas: ${d.totalQuestions}</p>
            <p>🏷️ Por categoria: ${categories || '—'}</p>
        `;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = document.getElementById('fileInput').files[0];
        const category = document.getElementById('categoryInput').value;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('category', category);

        document.getElementById('uploadStatus').textContent = 'Enviando...';

        const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
        const data = await res.json();

        document.getElementById('uploadStatus').textContent =
            res.ok ? `✅ "${data.originalFileName}" enviado (status: ${data.status})` : '❌ Erro no upload';

        loadDashboard();
    });

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('questionInput');
        const question = input.value.trim();
        if (!question) return;

        appendMessage('user', question);
        input.value = '';

        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question, chatId})
        });
        const data = await res.json();

        appendMessage('bot', data.answer, data.sources);
        loadDashboard();
    });

    function appendMessage(role, text, sources) {
        const div = document.createElement('div');
        div.className = role === 'user' ? 'msg-user' : 'msg-bot';

        const content = role === 'bot' ? marked.parse(text) : escapeHtml(text);
        let html = `<span>${content}</span>`;

        if (sources && sources.length > 0) {
            const list = sources.map(s => `${s.fileName} (${s.location})`).join(', ');
            html += `<div class="sources">📚 Fontes: ${list}</div>`;
        }
        div.innerHTML = html;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadDashboard();
</script>

</body>
</html>
