services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nb-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nb_assistant
      POSTGRES_USER: nb_admin
      POSTGRES_PASSWORD: nb_password
    ports:
      - "5432:5432"
    volumes:
      - nb_assistant_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nb_admin -d nb_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nb_assistant_pgdata: