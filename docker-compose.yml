services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: nb-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nb_assistant
      POSTGRES_USER: nb_admin
      POSTGRES_PASSWORD: nb_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nb_assistant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nb_admin -d nb_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nb-assistant-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STORAGE_PROVIDER: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nb_assistant
      SPRING_DATASOURCE_USERNAME: nb_admin
      SPRING_DATASOURCE_PASSWORD: nb_password
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    ports:
      - "8080:8080"
    volumes:
      - ./storage-local:/app/storage-local:Z

volumes:
  nb_assistant_pgdata: